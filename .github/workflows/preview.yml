name: Manual PR preview
run-name: "PR #${{ inputs.pr }} preview (${{ inputs.operation }})"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      sha:
        description: Expected PR head SHA (optional; supplied by Penny)
        required: false
        type: string
      operation:
        description: Deploy or delete the preview
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - delete

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Validate request and resolve commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run this workflow from main.'
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Enter a positive pull request number.'
            exit 1
          fi
          if [[ "$OPERATION" != deploy && "$OPERATION" != delete ]]; then
            echo '::error::Choose deploy or delete.'
            exit 1
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e '.base.ref == "main"' <<< "$pr" > /dev/null; then
            echo '::error::The pull request must target main.'
            exit 1
          fi
          if [[ "$OPERATION" == deploy ]] && ! jq -e '.state == "open"' <<< "$pr" > /dev/null; then
            echo '::error::Only open pull requests can be deployed.'
            exit 1
          fi
          sha="$(jq -r '.head.sha' <<< "$pr")"
          if [[ -n "$EXPECTED_SHA" && "$sha" != "$EXPECTED_SHA" ]]; then
            echo '::error::The PR head changed after the request. Request a new deployment.'
            exit 1
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'PR #%s: `%s` (%s)\n' "$PR_NUMBER" "$sha" "$OPERATION" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build preview without deployment credentials
    if: inputs.operation == 'deploy'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install latest Swift
        uses: vapor/swiftly-action@bedb227456c5f495afbef80baebee17a8a02cef4 # v0.2.1
        with:
          toolchain: latest
      - name: Checkout resolved PR commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Build site
        run: swift run VaporWebsite
      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish or delete preview
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (inputs.operation == 'delete' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr }}
      PR_SHA: ${{ needs.resolve.outputs.sha }}
      OPERATION: ${{ inputs.operation }}
    steps:
      # Only trusted workflow code is checked out in this job. The PR artifact is data.
      - name: Checkout deployment script from workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow
          persist-credentials: false
      - name: Install latest Swift
        uses: vapor/swiftly-action@bedb227456c5f495afbef80baebee17a8a02cef4 # v0.2.1
        with:
          toolchain: latest
      - name: Download built site
        if: inputs.operation == 'deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-site
          path: site
      - name: Check PR still matches the built commit
        if: inputs.operation == 'deploy'
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --arg sha "$PR_SHA" '.state == "open" and .base.ref == "main" and .head.sha == $sha' <<< "$pr" > /dev/null; then
            echo '::error::The PR changed or closed during the build. Run the workflow again.'
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Deploy or delete S3 preview
        run: swift workflow/.github/scripts/preview.swift
